<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DERIVION - Notes</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard-container">

    <!-- HEADER -->

    <header class="dashboard-header">

        <h1 class="brand-logo">
            <img src="assets/derivion_logo.png" alt="DERIVION">
        </h1>

        <div class="user-info">

            <span id="userName"></span>

            <button id="logoutButton"
                    onclick="logout()">

                Logout

            </button>

        </div>

    </header>


    <!-- MAIN LAYOUT -->

    <div class="dashboard-layout">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>Menu</h2>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="leads.html">
                    Leads
                </a>

                <a href="lead-assignments.html">
                    Lead Assignments
                </a>

                <a href="closed-leads.html">
                    Closed / Disposed Leads
                </a>

                <a href="call-logs.html">
                    Call Logs
                </a>

                <a href="follow-ups.html">
                    Follow-ups
                </a>

                <a href="notes.html"
                   class="active">
                    Notes
                </a>

                <a href="users.html">
                    Users
                </a>

                <a href="teams.html">
                    Teams
                </a>

                <a href="courses.html">
                    Courses
                </a>

                <a href="campaigns.html">
                    Campaigns
                </a>

            </nav>

        </aside>


        <!-- CONTENT -->

        <main class="dashboard-content notes-page">


            <div class="notes-page-header">

                <div>

                    <h2>Notes</h2>

                    <p class="page-description">
                        Manage customer notes and follow-up information.
                    </p>

                </div>

                <div class="notes-header-actions">

                    <button
                        type="button"
                        class="secondary-button"
                        onclick="window.location.href='dashboard.html'">

                        ← Back to Dashboard

                    </button>

                    <button
                        type="button"
                        class="primary-button"
                        onclick="window.location.href='add-note.html'">

                        + Add Note

                    </button>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="notes-toolbar">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search notes..."
                    oninput="searchNotes()">

                <button
                    type="button"
                    class="secondary-button"
                    onclick="refreshNotes()">

                    Refresh

                </button>

            </div>


            <!-- MESSAGE -->

            <div id="message"
                 class="page-message">
            </div>


            <!-- NOTES TABLE -->

            <div class="notes-table-container">

                <table class="notes-table">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Lead</th>

                            <th>User</th>

                            <th>Note</th>

                            <th>Created At</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="notesTableBody">

                    </tbody>

                </table>

            </div>


        </main>

    </div>

</div>


<script src="config.js"></script>

<script src="notifications.js"></script>

<script src="notes.js"></script>

<script src="access-control.js"></script>

</body>

</html>
