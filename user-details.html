<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DERIVION - User Details</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard-container">

    <!-- HEADER -->

    <header class="dashboard-header">

        <h1 class="brand-logo">
    <img src="assets/derivion_logo.png" alt="DERIVION">
</h1>

        <div class="user-info">

            <span id="userName">
                Admin
            </span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </header>


    <div class="dashboard-layout">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>Menu</h2>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="leads.html">
                    Leads
                </a>

                <a href="lead-assignments.html">
                    Lead Assignments
                </a>

<a href="closed-leads.html">
    Closed / Disposed Leads
</a>

                <a href="call-logs.html">
                    Call Logs
                </a>

                <a href="follow-ups.html">
                    Follow-ups
                </a>

                <a href="notes.html">
                    Notes
                </a>

                <a href="users.html"
                   class="active">
                    Users
                </a>

                <a href="#">
                    Teams
                </a>

                <a href="#">
                    Courses
                </a>

                <a href="#">
                    Campaigns
                </a>

            </nav>

        </aside>


        <!-- PAGE CONTENT -->

        <main class="dashboard-content">


            <div class="user-details-page">


                <!-- PAGE HEADER -->

                <div class="user-details-page-header">

                    <div>

                        <h2>User Details</h2>

                        <p>
                            View CRM user information.
                        </p>

                    </div>


                    <button
                        type="button"
                        onclick="window.location.href='users.html'">

                        ← Back to Users

                    </button>

                </div>


                <!-- MESSAGE -->

                <div id="message">

                </div>


                <!-- USER DETAILS CARD -->

                <div class="user-details-card">


                    <div class="detail-row">

                        <span class="detail-label">
                            User ID
                        </span>

                        <span
                            id="userId"
                            class="detail-value">
                            -
                        </span>

                    </div>


                    <div class="detail-row">

                        <span class="detail-label">
                            Full Name
                        </span>

                        <span
                            id="fullName"
                            class="detail-value">
                            -
                        </span>

                    </div>


                    <div class="detail-row">

                        <span class="detail-label">
                            Email
                        </span>

                        <span
                            id="email"
                            class="detail-value">
                            -
                        </span>

                    </div>


                    <div class="detail-row">

                        <span class="detail-label">
                            Role
                        </span>

                        <span
                            id="role"
                            class="detail-value">
                            -
                        </span>

                    </div>


                    <div class="detail-row">

                        <span class="detail-label">
                            Status
                        </span>

                        <span
                            id="status"
                            class="detail-value">
                            -
                        </span>

                    </div>


                    <div class="detail-row">

                        <span class="detail-label">
                            Created At
                        </span>

                        <span
                            id="createdAt"
                            class="detail-value">
                            -
                        </span>

                    </div>


                </div>


            </div>


        </main>

    </div>

</div>

<script src="config.js"></script>

<script src="notifications.js"></script>
<script src="user-details.js"></script>


<script src="access-control.js"></script>

</body>

</html>
