<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DERIVION - Note Details</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard-container">

    <header class="dashboard-header">

        <h1 class="brand-logo">
    <img src="assets/derivion_logo.png" alt="DERIVION">
</h1>

        <div>

            <span id="userName"></span>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <div class="dashboard-layout">

        <aside class="sidebar">

            <h2>Menu</h2>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="leads.html">
                Leads
            </a>

            <a href="lead-assignments.html">
                Lead Assignments
            </a>

<a href="closed-leads.html">
    Closed / Disposed Leads
</a>

            <a href="call-logs.html">
                Call Logs
            </a>

            <a href="follow-ups.html">
                Follow-ups
            </a>

            <a href="notes.html">
                Notes
            </a>

            <a href="#">
                Users
            </a>

            <a href="#">
                Teams
            </a>

            <a href="#">
                Courses
            </a>

            <a href="#">
                Campaigns
            </a>

        </aside>


        <main class="dashboard-content">

            <h2>Note Details</h2>

            <div id="message"></div>


            <div id="noteDetails">

                <p>
                    <strong>Note ID:</strong>
                    <span id="noteId"></span>
                </p>


                <p>
                    <strong>Lead ID:</strong>
                    <span id="leadId"></span>
                </p>


                <p>
                    <strong>User ID:</strong>
                    <span id="userId"></span>
                </p>


                <p>
                    <strong>Note:</strong>
                    <span id="note"></span>
                </p>


                <p>
                    <strong>Created At:</strong>
                    <span id="createdAt"></span>
                </p>


                <p>
                    <strong>Updated At:</strong>
                    <span id="updatedAt"></span>
                </p>

            </div>


            <br>


            <button
                type="button"
                onclick="window.location.href='notes.html'">

                Back to Notes

            </button>

        </main>

    </div>

</div>

<script src="config.js"></script>

<script src="notifications.js"></script>
<script src="note-details.js"></script>

<script src="access-control.js"></script>

</body>

</html>
