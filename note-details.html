<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DERIVION - Note Details</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="dashboard-container">


    <!-- ================================
         HEADER
         ================================ -->

    <header class="dashboard-header">


        <h1 class="brand-logo">

            <img
                src="assets/derivion_logo.png"
                alt="DERIVION">

        </h1>


        <div class="user-info">


            <span id="userName">
                Admin
            </span>


            <button id="logoutButton">
                Logout
            </button>


        </div>


    </header>



    <div class="dashboard-layout">


        <!-- ================================
             SIDEBAR
             ================================ -->

        <aside class="sidebar">


            <h2>
                Menu
            </h2>


            <nav>


                <a href="dashboard.html">
                    Dashboard
                </a>


                <a href="leads.html">
                    Leads
                </a>


                <a href="lead-assignments.html">
                    Lead Assignments
                </a>


                <a href="closed-leads.html">
                    Closed / Disposed Leads
                </a>


                <a href="call-logs.html">
                    Call Logs
                </a>


                <a href="follow-ups.html">
                    Follow-ups
                </a>


                <a
                    href="notes.html"
                    class="active">

                    Notes

                </a>


                <a href="users.html">
                    Users
                </a>


                <a href="teams.html">
                    Teams
                </a>


                <a href="courses.html">
                    Courses
                </a>


                <a href="campaigns.html">
                    Campaigns
                </a>


            </nav>


        </aside>



        <!-- ================================
             MAIN CONTENT
             ================================ -->

        <main class="dashboard-content">


            <!-- PAGE HEADER -->

            <div class="lead-details-header">


                <div>

                    <h2>
                        Note Details
                    </h2>


                    <p>
                        View complete note information.
                    </p>

                </div>


                <button
                    type="button"
                    class="secondary-button"
                    onclick="window.location.href='notes.html'">

                    ← Back to Notes

                </button>


            </div>



            <!-- MESSAGE -->

            <div id="message"></div>



            <!-- ================================
                 NOTE DETAILS CARD
                 ================================ -->

            <div class="lead-details-card">


                <!-- NOTE ID -->

                <div class="detail-row">

                    <div class="detail-label">
                        Note ID
                    </div>


                    <div
                        class="detail-value"
                        id="noteId">

                        -

                    </div>

                </div>



                <!-- LEAD ID -->

                <div class="detail-row">

                    <div class="detail-label">
                        Lead ID
                    </div>


                    <div
                        class="detail-value"
                        id="leadId">

                        -

                    </div>

                </div>



                <!-- USER ID -->

                <div class="detail-row">

                    <div class="detail-label">
                        User ID
                    </div>


                    <div
                        class="detail-value"
                        id="userId">

                        -

                    </div>

                </div>



                <!-- NOTE -->

                <div class="detail-row">


                    <div class="detail-label">
                        Note
                    </div>


                    <div
                        class="detail-value"
                        id="note">

                        -

                    </div>


                </div>



                <!-- CREATED AT -->

                <div class="detail-row">

                    <div class="detail-label">
                        Created At
                    </div>


                    <div
                        class="detail-value"
                        id="createdAt">

                        -

                    </div>

                </div>



                <!-- UPDATED AT -->

                <div class="detail-row">

                    <div class="detail-label">
                        Updated At
                    </div>


                    <div
                        class="detail-value"
                        id="updatedAt">

                        -

                    </div>

                </div>


            </div>



            <!-- ================================
                 BOTTOM ACTION
                 ================================ -->

            <div class="lead-details-actions">


                <button
                    type="button"
                    class="secondary-button"
                    onclick="window.location.href='notes.html'">

                    ← Back to Notes

                </button>


            </div>


        </main>


    </div>


</div>



<!-- ================================
     JAVASCRIPT
     ================================ -->

<script src="config.js"></script>

<script src="notifications.js"></script>

<script src="note-details.js"></script>

<script src="access-control.js"></script>


</body>

</html>
