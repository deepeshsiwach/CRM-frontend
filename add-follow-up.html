<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DERIVION - Add Follow-up</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="dashboard-container">


    <!-- ================================
         HEADER
         ================================ -->

    <header class="dashboard-header">

        <h1 class="brand-logo">

            <img
                src="assets/derivion_logo.png"
                alt="DERIVION">

        </h1>


        <div class="user-info">

            <span id="userName">
                Admin
            </span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </header>



    <div class="dashboard-layout">


        <!-- ================================
             SIDEBAR
             ================================ -->

        <aside class="sidebar">

            <h2>
                Menu
            </h2>


            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="leads.html">
                    Leads
                </a>

                <a href="lead-assignments.html">
                    Lead Assignments
                </a>

                <a href="closed-leads.html">
                    Closed / Disposed Leads
                </a>

                <a href="call-logs.html">
                    Call Logs
                </a>

                <a
                    href="follow-ups.html"
                    class="active">
                    Follow-ups
                </a>

                <a href="notes.html">
                    Notes
                </a>

                <a href="users.html">
                    Users
                </a>

                <a href="teams.html">
                    Teams
                </a>

                <a href="courses.html">
                    Courses
                </a>

                <a href="campaigns.html">
                    Campaigns
                </a>

            </nav>

        </aside>



        <!-- ================================
             MAIN CONTENT
             ================================ -->

        <main class="dashboard-content">


            <h2>
                Add Follow-up
            </h2>



            <div class="form-container">


                <form id="addFollowUpForm">


                    <!-- ================================
                         LEAD
                         ================================= -->

                    <div class="form-group">

                        <label for="leadDisplay">
                            Lead
                        </label>

                        <input
                            type="text"
                            id="leadDisplay"
                            readonly
                            placeholder="Loading lead...">

                        <!-- Hidden actual Lead ID -->

                        <input
                            type="hidden"
                            id="leadId"
                            name="leadId">

                    </div>



                    <!-- ================================
                         AGENT
                         ================================= -->

                    <div class="form-group">

                        <label for="agentId">
                            Agent
                        </label>

                        <select
                            id="agentId"
                            name="agentId"
                            required>

                            <option value="">
                                Loading agent...
                            </option>

                        </select>

                    </div>



                    <!-- ================================
                         FOLLOW-UP DATE
                         ================================= -->

                    <div class="form-group">

                        <label for="followUpDate">
                            Follow-up Date & Time
                        </label>

                        <input
                            type="datetime-local"
                            id="followUpDate"
                            name="followUpDate"
                            required>

                    </div>



                    <!-- ================================
                         PURPOSE
                         ================================= -->

                    <div class="form-group">

                        <label for="purpose">
                            Purpose
                        </label>

                        <input
                            type="text"
                            id="purpose"
                            name="purpose"
                            maxlength="255"
                            placeholder="Example: Course counselling">

                    </div>



                    <!-- ================================
                         STATUS
                         ================================= -->

                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                            required>

                            <option value="PENDING">
                                PENDING
                            </option>

                            <option value="COMPLETED">
                                COMPLETED
                            </option>

                            <option value="CANCELLED">
                                CANCELLED
                            </option>

                            <option value="MISSED">
                                MISSED
                            </option>

                        </select>

                    </div>



                    <!-- ================================
                         REMARKS
                         ================================= -->

                    <div class="form-group">

                        <label for="remarks">
                            Remarks
                        </label>

                        <textarea
                            id="remarks"
                            name="remarks"
                            rows="4"
                            placeholder="Enter follow-up remarks..."></textarea>

                    </div>



                    <!-- ================================
                         BUTTONS
                         ================================= -->

                    <button
                        type="submit">

                        Add Follow-up

                    </button>


                    <button
                        type="reset">

                        Clear

                    </button>


                    <button
                        type="button"
                        onclick="window.location.href='follow-ups.html'">

                        Cancel

                    </button>



                    <!-- ================================
                         MESSAGE
                         ================================= -->

                    <p id="addFollowUpMessage"></p>


                </form>


            </div>


        </main>


    </div>


</div>



<script src="config.js"></script>

<script src="add-follow-up.js"></script>

<script src="access-control.js"></script>


</body>

</html>
