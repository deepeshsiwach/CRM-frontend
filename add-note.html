<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DERIVION - Add Note</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="dashboard-container">


    <!-- ================================
         HEADER
         ================================ -->

    <header class="dashboard-header">

        <h1 class="brand-logo">

            <img
                src="assets/derivion_logo.png"
                alt="DERIVION">

        </h1>


        <div class="user-info">

            <span id="userName">
                Admin
            </span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </header>



    <!-- ================================
         LAYOUT
         ================================ -->

    <div class="dashboard-layout">


        <!-- ================================
             SIDEBAR
             ================================ -->

        <aside class="sidebar">

            <h2>
                Menu
            </h2>


            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="leads.html">
                    Leads
                </a>

                <a href="lead-assignments.html">
                    Lead Assignments
                </a>

                <a href="closed-leads.html">
                    Closed / Disposed Leads
                </a>

                <a href="call-logs.html">
                    Call Logs
                </a>

                <a href="follow-ups.html">
                    Follow-ups
                </a>

                <a
                    href="notes.html"
                    class="active">
                    Notes
                </a>

                <a href="users.html">
                    Users
                </a>

                <a href="teams.html">
                    Teams
                </a>

                <a href="courses.html">
                    Courses
                </a>

                <a href="campaigns.html">
                    Campaigns
                </a>

            </nav>

        </aside>



        <!-- ================================
             MAIN CONTENT
             ================================ -->

        <main class="dashboard-content">


            <div class="lead-details-header">

                <div>

                    <h2>
                        Add Note
                    </h2>

                    <p>
                        Add a note to this lead.
                    </p>

                </div>


                <button
                    type="button"
                    class="secondary-button"
                    id="backButton">

                    ← Back

                </button>

            </div>



            <!-- ================================
                 MESSAGE
                 ================================ -->

            <div
                id="message"
                style="margin-bottom: 15px;">
            </div>



            <!-- ================================
                 FORM
                 ================================ -->

            <div class="form-container">


                <form id="addNoteForm">


                    <!-- ================================
                         LEAD
                         ================================= -->

                    <div class="form-group">

                        <label for="leadDisplay">
                            Lead
                        </label>

                        <input
                            type="text"
                            id="leadDisplay"
                            readonly
                            placeholder="Loading lead...">

                        <!-- Actual Lead ID -->

                        <input
                            type="hidden"
                            id="leadId"
                            name="leadId">

                    </div>



                    <!-- ================================
                         USER / AGENT
                         ================================= -->

                    <div class="form-group">

                        <label for="userDisplay">
                            User
                        </label>

                        <input
                            type="text"
                            id="userDisplay"
                            readonly
                            placeholder="Loading user...">

                        <!-- Actual User ID -->

                        <input
                            type="hidden"
                            id="userId"
                            name="userId">

                    </div>



                    <!-- ================================
                         NOTE
                         ================================= -->

                    <div class="form-group">

                        <label for="note">
                            Note
                        </label>

                        <textarea
                            id="note"
                            name="note"
                            rows="6"
                            placeholder="Enter your note..."
                            required></textarea>

                    </div>



                    <!-- ================================
                         BUTTONS
                         ================================= -->

                    <div class="form-actions">

                        <button
                            type="submit"
                            class="primary-button">

                            Add Note

                        </button>


                        <button
                            type="button"
                            class="secondary-button"
                            id="clearButton">

                            Clear

                        </button>


                        <button
                            type="button"
                            class="secondary-button"
                            id="cancelButton">

                            Cancel

                        </button>

                    </div>


                </form>


            </div>


        </main>


    </div>


</div>



<script src="config.js"></script>

<script src="add-note.js"></script>

<script src="access-control.js"></script>


</body>

</html>
