<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Lead - ISFT CRM</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           TOP HEADER
        ========================= */

        .top-header {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-name {
            font-weight: 600;
            color: #374151;
        }

        .logout-button {
            border: none;
            background: #ef4444;
            color: white;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-button:hover {
            background: #dc2626;
        }

        /* =========================
           MAIN LAYOUT
        ========================= */

        .main-layout {
            display: flex;
            flex: 1;
            min-height: calc(100vh - 64px);
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 230px;
            background: #111827;
            padding: 20px 12px;
            flex-shrink: 0;
        }

        .sidebar-title {
            color: #9ca3af;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0 12px 10px;
            letter-spacing: 0.5px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #d1d5db;
            padding: 11px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
        }

        .sidebar a.active {
            background: #2563eb;
            color: white;
            font-weight: 600;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            flex: 1;
            padding: 28px;
            overflow-x: auto;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            gap: 20px;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            color: #111827;
        }

        .page-subtitle {
            margin: 6px 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        .back-button {
            text-decoration: none;
            display: inline-block;
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
        }

        .back-button:hover {
            background: #f3f4f6;
        }

        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 26px;
            max-width: 1000px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .form-section-title {
            margin: 0 0 18px;
            font-size: 18px;
            color: #111827;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            color: #111827;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .form-group input:disabled,
        .form-group select:disabled {
            background: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
        }

        .field-help {
            margin-top: 5px;
            font-size: 12px;
            color: #9ca3af;
        }

        /* =========================
           MESSAGE
        ========================= */

        #editMessage {
            margin-bottom: 18px;
            min-height: 20px;
            font-size: 14px;
            color: #374151;
            font-weight: 600;
        }

        /* =========================
           ACTIONS
        ========================= */

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e5e7eb;
        }

        .save-button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 22px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .cancel-button {
            text-decoration: none;
            background: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        .cancel-button:hover {
            background: #f3f4f6;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .content {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
            }

        }

        @media (max-width: 600px) {

            .main-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .sidebar a {
                display: inline-block;
                margin-right: 4px;
            }

            .top-header {
                padding: 0 14px;
            }

            .brand {
                font-size: 18px;
            }

            .user-name {
                display: none;
            }

            .form-card {
                padding: 18px;
            }

        }

    </style>
</head>

<body>

<div class="page-wrapper">

    <!-- =========================
         TOP HEADER
    ========================== -->

    <header class="top-header">

        <div class="brand">
            ISFT CRM
        </div>

        <div class="user-section">

            <span
                id="userName"
                class="user-name"
            >
                User
            </span>

            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN LAYOUT
    ========================== -->

    <div class="main-layout">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <div class="sidebar-title">
                CRM Menu
            </div>


            <a
                href="dashboard.html"
                data-roles="ADMIN,MANAGER,AGENT"
            >
                Dashboard
            </a>


            <a
                href="leads.html"
                data-roles="ADMIN,MANAGER,AGENT"
            >
                Leads
            </a>


            <a
                href="closed-leads.html"
                data-roles="ADMIN,MANAGER,AGENT"
            >
                Closed / Disposed Leads
            </a>


            <a
                href="call-logs.html"
                data-roles="ADMIN,MANAGER,AGENT"
            >
                Call Logs
            </a>


            <a
                href="follow-ups.html"
                data-roles="ADMIN,MANAGER,AGENT"
            >
                Follow-ups
            </a>


            <a
                href="notes.html"
                data-roles="ADMIN,MANAGER,AGENT"
            >
                Notes
            </a>


            <a
                href="lead-assignments.html"
                data-roles="ADMIN,MANAGER"
            >
                Lead Assignments
            </a>


            <a
                href="teams.html"
                data-roles="ADMIN,MANAGER"
            >
                Teams
            </a>


            <a
                href="courses.html"
                data-roles="ADMIN,MANAGER"
            >
                Courses
            </a>


            <a
                href="campaigns.html"
                data-roles="ADMIN,MANAGER"
            >
                Campaigns
            </a>


            <a
                href="users.html"
                data-roles="ADMIN"
            >
                Users
            </a>

        </aside>


        <!-- =========================
             CONTENT
        ========================== -->

        <main class="content">

            <div class="content-header">

                <div>

                    <h1 class="page-title">
                        Edit Lead
                    </h1>

                    <p class="page-subtitle">
                        Update lead information and status
                    </p>

                </div>


                <a
                    href="leads.html"
                    class="back-button"
                >
                    ← Back to Leads
                </a>

            </div>


            <!-- =========================
                 FORM
            ========================== -->

            <div class="form-card">

                <h2 class="form-section-title">
                    Lead Information
                </h2>


                <div
                    id="editMessage"
                    aria-live="polite"
                ></div>


                <form
                    id="editLeadForm"
                    autocomplete="off"
                >

                    <div class="form-grid">


                        <!-- FULL NAME -->

                        <div class="form-group">

                            <label for="fullName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter full name"
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter email address"
                            >

                        </div>


                        <!-- PHONE -->

                        <div class="form-group">

                            <label for="phone">
                                Phone
                            </label>

                            <input
                                type="text"
                                id="phone"
                                name="phone"
                                placeholder="Enter phone number"
                            >

                        </div>


                        <!-- COURSE -->

                        <div class="form-group">

                            <label for="courseInterested">
                                Course Interested
                            </label>

                            <input
                                type="text"
                                id="courseInterested"
                                name="courseInterested"
                                placeholder="Enter course"
                            >

                        </div>


                        <!-- LEAD SOURCE -->

                        <div class="form-group">

                            <label for="leadSource">
                                Lead Source
                            </label>

                            <input
                                type="text"
                                id="leadSource"
                                name="leadSource"
                                placeholder="Enter lead source"
                            >

                        </div>


                        <!-- STATUS -->

                        <div class="form-group">

                            <label for="status">
                                Lead Status
                            </label>

                            <select
                                id="status"
                                name="status"
                            >

                                <option value="NEW">
                                    NEW
                                </option>

                                <option value="CONTACTED">
                                    CONTACTED
                                </option>

                                <option value="INTERESTED">
                                    INTERESTED
                                </option>

                                <option value="FOLLOW_UP">
                                    FOLLOW_UP
                                </option>

                                <option value="COUNSELLING">
                                    COUNSELLING
                                </option>

                                <option value="ENROLLED">
                                    ENROLLED
                                </option>

                                <option value="NOT_INTERESTED">
                                    NOT_INTERESTED
                                </option>

                                <option value="WRONG_NUMBER">
                                    WRONG_NUMBER
                                </option>

                                <option value="NO_RESPONSE">
                                    NO_RESPONSE
                                </option>

                                <option value="LOST">
                                    LOST
                                </option>

                            </select>

                            <div class="field-help">
                                Agents can update only this field.
                            </div>

                        </div>


                        <!-- PRIORITY -->

                        <div class="form-group">

                            <label for="priority">
                                Priority
                            </label>

                            <select
                                id="priority"
                                name="priority"
                            >

                                <option value="LOW">
                                    LOW
                                </option>

                                <option value="MEDIUM">
                                    MEDIUM
                                </option>

                                <option value="HIGH">
                                    HIGH
                                </option>

                            </select>

                        </div>


                        <!-- CITY -->

                        <div class="form-group">

                            <label for="city">
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                name="city"
                                placeholder="Enter city"
                            >

                        </div>


                    </div>


                    <!-- =========================
                         ACTION BUTTONS
                    ========================== -->

                    <div class="form-actions">

                        <button
                            type="submit"
                            class="save-button"
                        >
                            Save Changes
                        </button>


                        <a
                            href="leads.html"
                            class="cancel-button"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </main>

    </div>

</div>


<!-- =========================
     SCRIPTS
     ORDER IS IMPORTANT
========================== -->

<script src="config.js"></script>

<script src="notifications.js"></script>

<script src="access-control.js"></script>

<script src="lead-edit.js"></script>

</body>

</html>
