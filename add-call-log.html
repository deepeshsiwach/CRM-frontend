<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DERIVION - Add Call Log</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="dashboard-container">


    <!-- ================================
         HEADER
    ================================ -->

    <header class="dashboard-header">

        <h1 class="brand-logo">

            <img
                src="assets/derivion_logo.png"
                alt="DERIVION">

        </h1>


        <div class="user-info">

            <span id="userName">
                Admin
            </span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </header>



    <div class="dashboard-layout">


        <!-- ================================
             SIDEBAR
        ================================ -->

        <aside class="sidebar">

            <h2>
                Menu
            </h2>


            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="leads.html">
                    Leads
                </a>

                <a href="lead-assignments.html">
                    Lead Assignments
                </a>

<a href="closed-leads.html">
    Closed / Disposed Leads
</a>

                <a
                    href="call-logs.html"
                    class="active">
                    Call Logs
                </a>

                <a href="follow-ups.html">
                    Follow-ups
                </a>

                <a href="notes.html">
                    Notes
                </a>

                <a href="users.html">
                    Users
                </a>

                <a href="teams.html">
                    Teams
                </a>

                <a href="courses.html">
                    Courses
                </a>

                <a href="campaigns.html">
                    Campaigns
                </a>

            </nav>

        </aside>



        <!-- ================================
             MAIN CONTENT
        ================================ -->

        <main class="dashboard-content">


            <div class="lead-details-header">

                <div>

                    <h2>
                        Add Call Log
                    </h2>

                    <p>
                        Record a call made to this lead.
                    </p>

                </div>


                <button
                    type="button"
                    class="secondary-button"
                    id="backButton">

                    ← Back

                </button>

            </div>



            <!-- ================================
                 FORM
            ================================ -->

            <div class="lead-details-card">


                <form id="callLogForm">


                    <!-- LEAD ID -->

                    <div class="form-group">

                        <label for="leadId">
                            Lead ID
                        </label>

                        <input
                            type="number"
                            id="leadId"
                            name="leadId"
                            readonly>

                    </div>



                    <!-- AGENT ID -->

                    <div class="form-group">

                        <label for="agentId">
                            Agent ID
                        </label>

                        <input
                            type="number"
                            id="agentId"
                            name="agentId"
                            required>

                    </div>



                    <!-- CALL START -->

                    <div class="form-group">

                        <label for="callStartTime">
                            Call Start Time
                        </label>

                        <input
                            type="datetime-local"
                            id="callStartTime"
                            name="callStartTime"
                            required>

                    </div>



                    <!-- CALL END -->

                    <div class="form-group">

                        <label for="callEndTime">
                            Call End Time
                        </label>

                        <input
                            type="datetime-local"
                            id="callEndTime"
                            name="callEndTime">

                    </div>



                    <!-- DURATION -->

                    <div class="form-group">

                        <label for="durationSeconds">
                            Duration (Seconds)
                        </label>

                        <input
                            type="number"
                            id="durationSeconds"
                            name="durationSeconds"
                            min="0"
                            placeholder="Example: 180">

                    </div>



                    <!-- CALL STATUS -->

                    <div class="form-group">

                        <label for="callStatus">
                            Call Status
                        </label>

                        <select
                            id="callStatus"
                            name="callStatus"
                            required>

                            <option value="">
                                Select Call Status
                            </option>

                            <option value="ANSWERED">
                                ANSWERED
                            </option>

                            <option value="NOT_ANSWERED">
                                NOT ANSWERED
                            </option>

                            <option value="BUSY">
                                BUSY
                            </option>

                            <option value="FAILED">
                                FAILED
                            </option>

                        </select>

                    </div>



                    <!-- CALL OUTCOME -->

                    <div class="form-group">

                        <label for="callOutcome">
                            Call Outcome
                        </label>

                        <select
                            id="callOutcome"
                            name="callOutcome">

                            <option value="">
                                Select Call Outcome
                            </option>

                            <option value="INTERESTED">
                                INTERESTED
                            </option>

                            <option value="NOT_INTERESTED">
                                NOT INTERESTED
                            </option>

                            <option value="CALL_BACK">
                                CALL BACK
                            </option>

                            <option value="FOLLOW_UP">
                                FOLLOW UP
                            </option>

                            <option value="COUNSELLING">
                                COUNSELLING
                            </option>

                            <option value="ENROLLED">
                                ENROLLED
                            </option>

                            <option value="WRONG_NUMBER">
                                WRONG NUMBER
                            </option>

                            <option value="NO_RESPONSE">
                                NO RESPONSE
                            </option>

                        </select>

                    </div>



                    <!-- REMARKS -->

                    <div class="form-group">

                        <label for="remarks">
                            Remarks
                        </label>

                        <textarea
                            id="remarks"
                            name="remarks"
                            rows="5"
                            placeholder="Enter call remarks..."></textarea>

                    </div>



                    <!-- MESSAGE -->

                    <div
                        id="message"
                        style="margin-bottom: 15px;">
                    </div>



                    <!-- ACTIONS -->

                    <div class="form-actions">

                        <button
                            type="button"
                            class="secondary-button"
                            id="cancelButton">

                            Cancel

                        </button>


                        <button
                            type="submit"
                            class="primary-button">

                            Save Call Log

                        </button>

                    </div>


                </form>


            </div>


        </main>


    </div>


</div>



<script src="config.js"></script>

<script src="notifications.js"></script>

<script src="add-call-log.js"></script>

<script src="access-control.js"></script>


</body>

</html>
