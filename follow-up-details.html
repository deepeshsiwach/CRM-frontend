<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DERIVION - Follow-up Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard-container">

    <header class="dashboard-header">
        <h1 class="brand-logo">
    <img src="assets/derivion_logo.png" alt="DERIVION">
</h1>

        <div>
            <span id="userName"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <h2>Menu</h2>

            <a href="dashboard.html">Dashboard</a>
            <a href="leads.html">Leads</a>
            <a href="lead-assignments.html">Lead Assignments</a>

<a href="closed-leads.html">
    Closed / Disposed Leads
</a>


            <a href="call-logs.html">Call Logs</a>
            <a href="follow-ups.html">Follow-ups</a>
            <a href="#">Notes</a>
            <a href="#">Users</a>
            <a href="#">Teams</a>
            <a href="#">Courses</a>
            <a href="#">Campaigns</a>

        </aside>

        <main class="dashboard-content">

            <h2>Follow-up Details</h2>

            <div id="message"></div>

            <div id="followUpDetails">

                <p>
                    <strong>Follow-up ID:</strong>
                    <span id="followUpId"></span>
                </p>

                <p>
                    <strong>Lead ID:</strong>
                    <span id="leadId"></span>
                </p>

                <p>
                    <strong>Agent ID:</strong>
                    <span id="agentId"></span>
                </p>

                <p>
                    <strong>Follow-up Date:</strong>
                    <span id="followUpDate"></span>
                </p>

                <p>
                    <strong>Purpose:</strong>
                    <span id="purpose"></span>
                </p>

                <p>
    <strong>Status:</strong>
    <span id="status"></span>
</p>

<div style="margin-top: 10px;">
    <select id="followUpStatusSelect">
        <option value="PENDING">PENDING</option>
        <option value="COMPLETED">COMPLETED</option>
        <option value="CANCELLED">CANCELLED</option>
        <option value="MISSED">MISSED</option>
    </select>

    <button
        type="button"
        class="primary-button"
        id="updateFollowUpStatusButton">
        Update Status
    </button>

    <div
        id="followUpStatusMessage"
        style="margin-top: 8px;">
    </div>
</div>

                <p>
                    <strong>Remarks:</strong>
                    <span id="remarks"></span>
                </p>

                <p>
                    <strong>Created At:</strong>
                    <span id="createdAt"></span>
                </p>

                <p>
                    <strong>Updated At:</strong>
                    <span id="updatedAt"></span>
                </p>

            </div>

            <br>

            <button
                type="button"
                onclick="window.location.href='follow-ups.html'">
                Back to Follow-ups
            </button>

        </main>

    </div>

</div>
<script src="config.js"></script>
<script src="notifications.js"></script>
<script src="follow-up-details.js"></script>


<script src="access-control.js"></script>

</body>
</html>
