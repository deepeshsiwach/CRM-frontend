<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DERIVION</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <h1 class="login-brand-logo">
    <img src="assets/derivion_logo.png" alt="DERIVION">
</h1>

        <p>Login to your account</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>
<script src="config.js"></script>
<script src="notifications.js"></script>
    <script src="script.js"></script>



</body>
</html>
